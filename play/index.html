<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- The player talks to no server: scripts and styles from this site only, no fetch/XHR at all. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#F6F6F2">
  <title>Quizpen quiz</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="play.css">
  <script src="codec.js" defer></script>
  <script src="play.js" defer></script>
</head>
<body>
  <div class="app" id="app" aria-live="off">
    <div class="screen screen-center" data-boot>
      <p class="boot">Loading the quiz&hellip;</p>
    </div>
  </div>
  <noscript>
    <div class="screen screen-center"><p class="boot">Turn on JavaScript to play this quiz. / Увімкни JavaScript, щоб пройти тест.</p></div>
  </noscript>
</body>
</html>
